name: Build and test Kernel Module

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository (owner/repo)
        required: true
        default: RolandoMagico/linux

      ref:
        description: Branch or Commit
        required: true
        default: D-Link-ODM

      linux_path:
        description: Path to the linux kernel sources
        required: true
        default: linux

jobs:
  execute:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Checkout Kernel Sources
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: ${{ inputs.linux_path }}
          show-progress: false
      - name: Update APT
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y build-essential gcc make bc flex bison libelf-dev libssl-dev qemu-system-x86 python3

      - name: Run Tests
        run: cd ${{ inputs.linux_path }} && ./tools/testing/kunit/kunit.py run --arch=x86_64 --kunitconfig=../defaultconfig --raw_output
