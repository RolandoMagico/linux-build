name: Build and test Kernel Module

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository (owner/repo)
        required: true
        default: RolandoMagico/linux

      ref:
        description: Branch or Commit
        required: true
        default: D-Link-ODM

      module_config:
        description: CONFIG of the module (without CONFIG_)
        required: true
        default: NVMEM_LAYOUT_DLINK_ODM_TLV

      test_config:
        description: CONFIG of the KUnit tests (without CONFIG_)
        required: true
        default: NVMEM_LAYOUT_DLINK_ODM_TLV_KUNIT_TEST

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc make bc \
            flex bison \
            libelf-dev libssl-dev \
            qemu-system-x86 python3

      # =========================
      # SINGLE SOURCE CONFIG
      # =========================
      - name: Create KUnit config
        run: |
          cat > .kunitconfig <<EOF
          CONFIG_KUNIT=y
          CONFIG_KUNIT_ALL_TESTS=y

          CONFIG_NVMEM=y
          CONFIG_NVMEM_LAYOUTS=y

          CONFIG_${{ inputs.module_config }}=y
          CONFIG_${{ inputs.test_config }}=y
          EOF

      # =========================
      # Build + normalize config
      # =========================
      - name: Prepare kernel config
        run: |
          make O=build defconfig
          make O=build olddefconfig KCONFIG_ALLCONFIG=.kunitconfig

      # =========================
      # Debug (important)
      # =========================
      - name: Debug config
        run: |
          grep -E "NVMEM|DLINK" build/.config || true

      # =========================
      # Build ONLY your subsystem
      # =========================
      - name: Build module
        run: |
          make -j$(nproc) O=build drivers/nvmem/layouts/

      # =========================
      # Run KUnit WITHOUT config reset
      # =========================
      - name: Run KUnit
        run: |
          ./tools/testing/kunit/kunit.py run \
            --kunitconfig=.kunitconfig \
            --arch=x86_64 \
            --jobs $(nproc)
